<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="slow-writer">
<title>{{TITLE}} · {{SITE_TITLE}}</title>
<meta name="description" content="{{SUMMARY}}">
<meta name="author" content="{{AUTHOR}}">
<meta name="theme-color" content="#eef0f1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_TITLE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="zh_CN">
<meta property="article:published_time" content="{{DATE_ISO}}">
<meta property="article:modified_time" content="{{DATE_MODIFIED_ISO}}">
<meta property="article:author" content="{{AUTHOR}}">
{{ARTICLE_TAG_META}}
{{SOCIAL_IMAGE_TAGS}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{SUMMARY}}">
<script type="application/ld+json">{{JSON_LD}}</script>
<style>
  :root {
    --bg: #eef0f1;
    --paper: #ffffff;
    --ink: #1f2328;
    --muted: #7a8088;
    --green: #07c160;
    --green-dark: #06ad56;
    --line: rgba(31, 35, 40, 0.09);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 0%, rgba(7, 193, 96, 0.07), transparent 30%),
      radial-gradient(circle at 88% 10%, rgba(255, 196, 87, 0.10), transparent 26%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .topbar {
    max-width: 900px;
    margin: 0 auto;
    padding: 22px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: #5b6168;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: #2f3439;
    text-decoration: none;
    font-weight: 600;
  }
  .brand-mark {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(7, 193, 96, 0.12);
  }
  .back {
    color: #6b7178;
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.55);
  }
  .back:hover { background: #fff; color: #1f2328; }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 18px 64px;
  }
  .paper {
    overflow: hidden;
    background: var(--paper);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    box-shadow: 0 22px 60px rgba(31, 35, 40, 0.10), 0 3px 10px rgba(31, 35, 40, 0.04);
  }
  .cover {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #e7e9e8;
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 36%;
    background: linear-gradient(to top, rgba(18, 22, 25, 0.20), transparent);
    pointer-events: none;
  }
  .article-head {
    padding: 34px 40px 0;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--green-dark);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .kicker::before {
    content: "";
    width: 18px;
    height: 2px;
    background: var(--green);
    border-radius: 2px;
  }
  .title {
    margin: 0 0 16px;
    font-size: clamp(26px, 4.6vw, 38px);
    line-height: 1.32;
    letter-spacing: -0.01em;
    font-weight: 800;
    color: #191d21;
  }
  .summary {
    margin: 0 0 22px;
    color: #646a71;
    font-size: 16px;
    line-height: 1.8;
  }
  .rule {
    margin: 26px 40px 0;
    height: 1px;
    background: linear-gradient(to right, var(--line), rgba(31, 35, 40, 0.02));
  }
  .content {
    padding: 30px 40px 18px;
  }
  .content > :first-child { margin-top: 0 !important; }
  .content > :last-child { margin-bottom: 0 !important; }
  .content img { max-width: 100%; height: auto; }
  .content a { overflow-wrap: anywhere; }
  .article-foot {
    padding: 0 40px 38px;
  }
  .foot-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 7px;
    background: #f2f5f3;
    color: #4d5650;
    font-size: 12px;
    line-height: 1.4;
  }
  .foot-note {
    margin: 18px 0 0;
    color: #a0a5ab;
    font-size: 12px;
    line-height: 1.7;
  }
  .copy-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f7f9f8;
    color: #5b625d;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn:hover {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .copy-btn:active { transform: translateY(1px) scale(0.98); }
  .copy-btn:disabled { cursor: wait; opacity: 0.7; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 8px);
    z-index: 60;
    max-width: calc(100vw - 40px);
    padding: 10px 16px;
    border-radius: 9px;
    background: rgba(27, 31, 35, 0.93);
    color: #fff;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  @media (max-width: 640px) {
    .topbar { padding: 16px 16px 8px; }
    .page { padding: 6px 10px 44px; }
    .paper { border-radius: 14px; }
    .article-head { padding: 26px 22px 0; }
    .rule { margin: 22px 22px 0; }
    .content { padding: 24px 22px 12px; }
    .article-foot { padding: 0 22px 30px; }
    .summary { font-size: 15px; }
    .copy-btn { width: 36px; height: 36px; }
  }
  @media print {
    body { background: #fff; }
    .topbar, .toast, .copy-btn { display: none !important; }
    .page { max-width: none; padding: 0; }
    .paper { border: 0; box-shadow: none; border-radius: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-mark"></span>
    <span>{{SITE_TITLE}}</span>
  </a>
  <a class="back" href="../index.html">← 返回首页</a>
</header>

<main class="page">
  <article class="paper">
    <div class="cover">
      <img src="{{COVER}}" alt="{{COVER_ALT}}" fetchpriority="high" decoding="async">
    </div>

    <header class="article-head">
      <div class="kicker">{{KICKER}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="summary">{{SUMMARY}}</p>
    </header>

    <div class="rule"></div>

    <div class="content" id="article-content">
{{CONTENT}}
    </div>

    <footer class="article-foot">
      <div class="foot-row">
        <div class="tags">{{TAGS}}</div>
        <button class="copy-btn" id="copy-btn" type="button" aria-label="复制文章内容" title="复制文章内容">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
            <path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
      <p class="foot-note">{{SITE_FOOTER}}</p>
    </footer>
  </article>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var btn = document.getElementById('copy-btn');
    var toastEl = document.getElementById('toast');
    var content = document.getElementById('article-content');
    var timer = null;

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () {
        toastEl.classList.remove('show');
      }, 2600);
    }

    function fallbackCopy(node) {
      var range = document.createRange();
      range.selectNodeContents(node);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      var ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (err) {
        ok = false;
      }
      selection.removeAllRanges();
      if (!ok) throw new Error('copy failed');
    }

    function cleanClone() {
      var clone = content.cloneNode(true);
      clone.querySelectorAll('[data-copy-exclude]').forEach(function (el) {
        el.remove();
      });
      clone.querySelectorAll('a').forEach(function (a) {
        a.removeAttribute('target');
        a.removeAttribute('rel');
      });
      return clone;
    }

    async function copyArticle() {
      var clone = cleanClone();
      var html = clone.innerHTML.trim();
      var text = clone.innerText.trim();
      if (!html) {
        toast('正文是空的，无法复制');
        return;
      }
      btn.disabled = true;
      try {
        if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
          var item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
        } else {
          fallbackCopy(content);
        }
        toast('已复制文章内容');
      } catch (err) {
        try {
          fallbackCopy(content);
          toast('已复制文章内容');
        } catch (err2) {
          toast('复制失败，请手动选择正文复制');
        }
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', copyArticle);
  })();
</script>
</body>
</html>
